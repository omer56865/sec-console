<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecConsole - Security Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151b26;
            --accent-color: #00ff66;
            --danger-color: #ff3333;
            --warning-color: #ffcc00;
            --text-color: #e0e6ed;
            --border-color: #232d3f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: var(--accent-color);
            margin: 0;
            font-size: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .card h2 {
            margin-top: 0;
            font-size: 18px;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        textarea, input, select {
            width: 100%;
            background-color: #080a0f;
            border: 1px solid var(--border-color);
            color: #00ff66;
            padding: 10px;
            font-family: monospace;
            box-sizing: border-box;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background-color: #1a3a2a;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 10px 15px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.2s;
        }

        button:hover {
            background-color: var(--accent-color);
            color: #000;
        }

        .output-box {
            background-color: #05070a;
            border: 1px dashed var(--border-color);
            padding: 10px;
            min-height: 80px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 13px;
        }

        .badge {
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 11px;
        }

        .badge-HIGH { background-color: var(--danger-color); color: #fff; }
        .badge-MEDIUM { background-color: var(--warning-color); color: #000; }
        .badge-LOW { background-color: var(--accent-color); color: #000; }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>> SEC_CONSOLE v1.0</h1>
        <span>[ STATUS: ONLINE ]</span>
    </header>

    <!-- SAST TARAMA & AI DÜZELTME -->
    <div class="grid-2">
        <div class="card">
            <h2>[+] Kod Güvenliği (SAST)</h2>
            <textarea id="codeArea" rows="10" placeholder="Aşağıya Python kodunu yapıştırın..."></textarea>
            <button onclick="scanCode()">KODU TARA</button>
        </div>

        <div class="card">
            <h2>[=] Tarama Sonuçları</h2>
            <div id="scanResults" class="output-box">Henüz tarama yapılmadı.</div>
            <br>
            <button id="pdfBtn" style="display:none;" onclick="exportPDF()">PDF RAPOR İNDİR</button>
        </div>
    </div>

    <!-- GEMINI AI -->
    <div class="card">
        <h2>[*] Gemini AI Otomatik Onarım</h2>
        <input type="password" id="geminiApiKey" placeholder="Gemini API Key (Opsiyonel)">
        <button onclick="fixWithAI()">KODU AI İLE DÜZELT</button>
        <div id="aiResult" class="output-box" style="margin-top: 10px;"></div>
    </div>

    <!-- OSINT VE VIRUSTOTAL -->
    <div class="grid-2">
        <div class="card">
            <h2>[?] OSINT / Shodan Sorgusu</h2>
            <input type="text" id="osintTarget" placeholder="Domain veya IP (Örn: google.com)">
            <button onclick="scanOSINT()">SORGULA</button>
            <div id="osintResults" class="output-box" style="margin-top: 10px;"></div>
        </div>

        <div class="card">
            <h2>[!] VirusTotal Analiz</h2>
            <input type="password" id="vtApiKey" placeholder="VT API Key">
            <input type="text" id="vtTarget" placeholder="Hash veya IP adresi">
            <button onclick="scanVT()">VIRUSTOTAL TARA</button>
            <div id="vtResults" class="output-box" style="margin-top: 10px;"></div>
        </div>
    </div>
</div>

<script>
    let lastIssues = [];
    let lastCode = "";

    async function scanCode() {
        const code = document.getElementById("codeArea").value;
        const resultsDiv = document.getElementById("scanResults");
        lastCode = code;

        if (!code.trim()) {
            alert("Lütfen kod girin!");
            return;
        }

        resultsDiv.innerText = "> Tarama başlatıldı...";

        try {
            const res = await fetch('/api/scan-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
            });
            const data = await res.json();

            if (data.status === "success") {
                lastIssues = data.issues;
                document.getElementById("pdfBtn").style.display = "inline-block";
                
                if (data.issues_count === 0) {
                    resultsDiv.innerText = "[+] Zafiyet bulunamadı. Kod temiz!";
                    return;
                }

                let text = `[!] Toplam ${data.issues_count} Zafiyet Bulundu:\n\n`;
                data.issues.forEach(i => {
                    text += `• [${i.severity}] Satır ${i.line}: ${i.message} (${i.check_id})\n`;
                });
                resultsDiv.innerText = text;
            } else {
                resultsDiv.innerText = "[-] Hata: " + data.message;
            }
        } catch (err) {
            resultsDiv.innerText = "[-] Sunucu bağlantı hatası!";
        }
    }

    async function fixWithAI() {
        const apiKey = document.getElementById("geminiApiKey").value;
        const aiDiv = document.getElementById("aiResult");

        if (!lastCode || lastIssues.length === 0) {
            alert("Önce kodu tarayıp zafiyet bulmalısınız!");
            return;
        }

        aiDiv.innerText = "> AI kod analiz ediliyor...";

        try {
            const res = await fetch('/api/fix-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: lastCode, issues: lastIssues, api_key: apiKey })
            });
            const data = await res.json();

            if (data.status === "success") {
                aiDiv.innerText = data.explanation;
            } else {
                aiDiv.innerText = "[-] AI Hatası: " + (data.detail || "Yanıt alınamadı.");
            }
        } catch (err) {
            aiDiv.innerText = "[-] AI servisine bağlanılamadı.";
        }
    }

    async function exportPDF() {
        try {
            const res = await fetch('/api/export-pdf', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: lastCode, issues: lastIssues })
            });
            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "SecConsole_Report.pdf";
            document.body.appendChild(a);
            a.click();
            a.remove();
        } catch (err) {
            alert("PDF indirme hatası!");
        }
    }

    async function scanOSINT() {
        const domain = document.getElementById("osintTarget").value;
        const resDiv = document.getElementById("osintResults");

        if (!domain) return;
        resDiv.innerText = "> Sorgulanıyor...";

        try {
            const res = await fetch('/api/osint', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ domain: domain })
            });
            const data = await res.json();

            if (data.status === "success") {
                resDiv.innerText = `IP: ${data.ip}\nPorts: ${data.ports.join(', ')}\nHostnames: ${data.hostnames.join(', ')}\nVulns: ${data.vulns.join(', ')}`;
            } else {
                resDiv.innerText = "[-] Sonuç bulunamadı.";
            }
        } catch (err) {
            resDiv.innerText = "[-] Sorgu hatası.";
        }
    }

    async function scanVT() {
        const apiKey = document.getElementById("vtApiKey").value;
        const target = document.getElementById("vtTarget").value;
        const resDiv = document.getElementById("vtResults");

        if (!target) return;
        resDiv.innerText = "> VirusTotal sorgulanıyor...";

        try {
            const res = await fetch('/api/virustotal', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ resource: target, api_key: apiKey })
            });
            const data = await res.json();

            if (data.status === "success") {
                resDiv.innerText = `Zararlı (Malicious): ${data.malicious}\nŞüpheli (Suspicious): ${data.suspicious}\nTemiz (Harmless): ${data.harmless}\nRepütasyon: ${data.reputation}`;
            } else {
                resDiv.innerText = "[-] " + (data.message || data.detail);
            }
        } catch (err) {
            resDiv.innerText = "[-] VT bağlantı hatası.";
        }
    }
</script>

</body>
</html>
